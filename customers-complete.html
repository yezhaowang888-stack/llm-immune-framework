<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗器械客户全信息管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f8fafc; color: #334155; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* 头部样式 */
        header { 
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white; padding: 25px 30px; border-radius: 12px; 
            margin-bottom: 30px; box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
        }
        header h1 { 
            font-size: 28px; margin-bottom: 10px; display: flex; align-items: center;
            font-weight: 600;
        }
        header h1:before { content: '🏥'; margin-right: 15px; font-size: 32px; }
        header .subtitle { 
            color: #e2e8f0; font-size: 16px; opacity: 0.95; 
            line-height: 1.6;
        }
        
        /* 统计卡片 */
        .stats-cards { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card { 
            background: white; padding: 22px; border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08); text-align: center;
            border-top: 4px solid;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card.total { border-color: #3b82f6; }
        .stat-card.valid { border-color: #10b981; }
        .stat-card.expiring { border-color: #f59e0b; }
        .stat-card.expired { border-color: #ef4444; }
        .stat-value { 
            font-size: 36px; font-weight: 700; margin: 12px 0; 
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .stat-label { color: #64748b; font-size: 14px; font-weight: 500; }
        .stat-total { color: #3b82f6; }
        .stat-valid { color: #10b981; }
        .stat-expiring { color: #f59e0b; }
        .stat-expired { color: #ef4444; }
        
        /* 工具栏 */
        .toolbar { 
            background: white; padding: 22px; border-radius: 10px; 
            margin-bottom: 25px; display: flex; gap: 15px; align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .btn { 
            padding: 12px 24px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 600; font-size: 14px;
            transition: all 0.3s; display: flex; align-items: center; gap: 8px;
            min-width: 120px; justify-content: center;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: white; box-shadow: 0 3px 6px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #2563eb, #1e40af);
            box-shadow: 0 5px 10px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
        .btn-success { 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: white; box-shadow: 0 3px 6px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover { 
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 5px 10px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }
        .btn-export { 
            background: linear-gradient(135deg, #8b5cf6, #7c3aed); 
            color: white; box-shadow: 0 3px 6px rgba(139, 92, 246, 0.3);
        }
        .btn-export:hover { 
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            box-shadow: 0 5px 10px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }
        
        .search-box { 
            flex: 1; padding: 12px 20px; border: 2px solid #e2e8f0; 
            border-radius: 8px; font-size: 14px; transition: all 0.3s;
            background: #f8fafc;
        }
        .search-box:focus { 
            outline: none; border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }
        
        /* 内容区域 */
        .content { 
            background: white; border-radius: 10px; padding: 25px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        
        /* 表格样式 */
        .table-container { 
            overflow-x: auto; border-radius: 8px; 
            border: 1px solid #e2e8f0; margin-top: 20px;
        }
        table { 
            width: 100%; border-collapse: collapse; 
            min-width: 1300px;
        }
        th { 
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0); 
            padding: 18px 15px; text-align: left; font-weight: 600;
            color: #1e293b; border-bottom: 2px solid #cbd5e1;
            position: sticky; top: 0; white-space: nowrap;
        }
        td { 
            padding: 16px 15px; border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }
        tr:hover { background: #f8fafc; }
        tr:nth-child(even) { background: #fafbfc; }
        
        /* 状态标签 */
        .status-badge { 
            padding: 6px 12px; border-radius: 20px; font-size: 12px; 
            font-weight: 600; display: inline-block; text-align: center;
            min-width: 80px;
        }
        .status-valid { 
            background: #d1fae5; color: #065f46; 
            border: 1px solid #a7f3d0;
        }
        .status-expiring { 
            background: #fef3c7; color: #92400e; 
            border: 1px solid #fde68a;
        }
        .status-expired { 
            background: #fee2e2; color: #991b1b; 
            border: 1px solid #fecaca;
        }
        .status-unknown { 
            background: #e0e7ff; color: #3730a3; 
            border: 1px solid #c7d2fe;
        }
        
        /* 操作按钮 */
        .action-buttons { display: flex; gap: 8px; }
        .action-btn { 
            padding: 6px 12px; border: none; border-radius: 6px; 
            cursor: pointer; font-size: 12px; font-weight: 500;
            transition: all 0.2s; min-width: 60px;
        }
        .edit-btn { 
            background: #3b82f6; color: white; 
            border: 1px solid #2563eb;
        }
        .edit-btn:hover { 
            background: #2563eb; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
        .delete-btn { 
            background: #ef4444; color: white; 
            border: 1px solid #dc2626;
        }
        .delete-btn:hover { 
            background: #dc2626; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
        }
        .view-btn { 
            background: #10b981; color: white; 
            border: 1px solid #059669;
        }
        .view-btn:hover { 
            background: #059669; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
        }
        
        /* 空状态 */
        .empty-state { 
            text-align: center; padding: 80px 20px; color: #94a3b8;
        }
        .empty-state:before { 
            content: '📭'; font-size: 64px; display: block; 
            margin-bottom: 25px; opacity: 0.5;
        }
        .empty-state h3 { 
            font-size: 20px; margin-bottom: 15px; color: #475569;
        }
        .empty-state p { 
            color: #64748b; margin-bottom: 30px; max-width: 500px;
            margin-left: auto; margin-right: auto; line-height: 1.6;
        }
        
        /* 模态框 */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); 
            justify-content: center; align-items: center; z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal.show { 
            display: flex; animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { 
            from { opacity: 0; } to { opacity: 1; }
        }
        .modal-content { 
            background: white; padding: 40px; border-radius: 12px; 
            width: 95%; max-width: 1000px; max-height: 90vh; 
            overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        /* 表单样式 */
        .form-section { 
            margin-bottom: 35px; padding-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
        }
        .section-title { 
            font-size: 18px; font-weight: 600; color: #1e293b; 
            margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 2px solid #3b82f6; display: flex;
            align-items: center; gap: 10px;
        }
        .section-title:before { 
            content: '📋'; font-size: 20px;
        }
        
        .form-row { 
            display: flex; gap: 20px; margin-bottom: 20px;
        }
        .form-group { flex: 1; }
        .form-group.full-width { flex: 0 0 100%; }
        
        .form-label { 
            display: block; margin-bottom: 10px; font-weight: 600; 
            color: #334155; font-size: 14px;
        }
        .form-label .required { color: #ef4444; margin-left: 4px; }
        
        .form-control { 
            width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; 
            border-radius: 8px; font-size: 14px; transition: all 0.3s;
            background: #f8fafc;
        }
        .form-control:focus { 
            outline: none; border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }
        .form-control.small { padding: 8px 12px; font-size: 13px; }
        
        textarea.form-control { 
            min-height: 80px; resize: vertical;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        
        .form-hint { 
            color: #64748b; font-size: 12px; margin-top: 6px;
            display: block;
        }
        
        /* 资质卡片 */
        .qualification-cards { 
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 20px; margin-top: 15px;
        }
        .qual-card { 
            background: #f8fafc; border: 2px solid #e2e8f0;
            border-radius: 8px; padding: 20px;
        }
        .qual-card h4 { 
            color: #1e293b; margin-bottom: 15px; font-size: 15px;
            display: flex; align-items: center; gap: 8px;
        }
        
        /* 按钮组 */
        .form-actions { 
            display: flex; gap: 15px; margin-top: 40px;
            padding-top: 25px; border-top: 2px solid #e2e8f0;
        }
        .form-actions .btn { flex: 1; }
        
        /* 标签页 */
        .tabs { 
            display: flex; border-bottom: 2px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .tab { 
            padding: 15px 25px; background: none; border: none;
            font-weight: 600; color: #64748b; cursor: pointer;
            border-bottom: 3px solid transparent; transition: all 0.3s;
        }
        .tab:hover { color: #3b82f6; }
        .tab.active { 
            color: #3b82f6; border-bottom-color: #3b82f6;
            background: #f0f9ff;
        }
        
        /* 警告条 */
        .alert-bar { 
            background: linear-gradient(135deg, #fef3c7, #fde68a); 
            color: #92400e; padding: 16px 20px; border-radius: 8px; 
            margin-bottom: 25px; display: flex; align-items: center;
            border-left: 4px solid #f59e0b;
        }
        .alert-bar:before { 
            content: '⚠️'; margin-right: 12px; font-size: 20px;
        }
        .alert-bar strong { margin: 0 5px; }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .stats-cards { grid-template-columns: repeat(2, 1fr); }
            .qualification-cards { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .stats-cards { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; gap: 15px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar .btn { width: 100%; }
            .modal-content { padding: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>医疗器械客户全信息管理系统</h1>
            <div class="subtitle">
                完整管理客户营业执照、开票信息、联系人、授权人及各类资质证件，专业保障医疗器械业务合规运行
            </div
