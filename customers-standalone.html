<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户信息管理 - 医疗器械系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fa; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: #2c3e50; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .status-valid { color: green; font-weight: bold; }
        .status-expiring { color: orange; font-weight: bold; }
        .status-expired { color: red; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 客户信息管理系统</h1>
            <p>管理客户基本信息、资质信息及到期预警</p>
        </header>
        
        <div class="toolbar">
            <button class="btn btn-primary" onclick="showAddModal()">➕ 新增客户</button>
            <button class="btn btn-success" onclick="loadCustomers()">🔄 刷新</button>
            <div style="flex: 1;"></div>
            <div>总客户: <span id="totalCount">0</span> | 有效: <span id="validCount">0</span> | 即将到期: <span id="expiringCount">0</span> | 过期: <span id="expiredCount">0</span></div>
        </div>
        
        <div id="customerList">
            <p>加载中...</p>
        </div>
    </div>
    
    <!-- 新增/编辑模态框 -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">新增客户</h2>
            <form id="customerForm" onsubmit="saveCustomer(event)">
                <input type="hidden" id="customerId">
                
                <div class="form-group">
                    <label>客户编码 *</label>
                    <input type="text" class="form-control" id="customerCode" required>
                </div>
                
                <div class="form-group">
                    <label>客户名称 *</label>
                    <input type="text" class="form-control" id="customerName" required>
                </div>
                
                <div class="form-group">
                    <label>联系人</label>
                    <input type="text" class="form-control" id="contactPerson">
                </div>
                
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="tel" class="form-control" id="phone">
                </div>
                
                <div class="form-group">
                    <label>资质到期日期</label>
                    <input type="date" class="form-control" id="qualificationExpiryDate">
                </div>
                
                <div class="form-group">
                    <label>资质类型</label>
                    <select class="form-control" id="qualificationType">
                        <option value="">请选择</option>
                        <option value="医疗器械经营许可证">医疗器械经营许可证</option>
                        <option value="医疗器械生产许可证">医疗器械生产许可证</option>
                        <option value="医疗器械注册证">医疗器械注册证</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">保存</button>
                    <button type="button" class="btn" onclick="hideModal()" style="flex: 1; background: #95a5a6; color: white;">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 客户数据存储（使用localStorage）
        const STORAGE_KEY = 'medical_customers';
        
        // 初始化示例数据
        function initSampleData() {
            if (!localStorage.getItem(STORAGE_KEY)) {
                const sampleData = [
                    {
                        id: 1,
                        customerCode: 'CUST001',
                        customerName: '北京协和医院',
                        contactPerson: '张主任',
                        phone: '13800138000',
                        qualificationType: '医疗器械经营许可证',
                        qualificationExpiryDate: '2026-12-31'
                    },
                    {
                        id: 2,
                        customerCode: 'CUST002',
                        customerName: '上海华山医院',
                        contactPerson: '李医生',
                        phone: '13900139000',
                        qualificationType: '医疗器械生产许可证',
                        qualificationExpiryDate: '2026-06-30'
                    },
                    {
                        id: 3,
                        customerCode: 'CUST003',
                        customerName: '广州中山医院',
                        contactPerson: '王护士长',
                        phone: '13700137000',
                        qualificationType: '医疗器械注册证',
                        qualificationExpiryDate: '2025-12-31'
                    }
                ];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleData));
            }
        }
        
        // 获取所有客户
        function getAllCustomers() {
            initSampleData();
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }
        
        // 保存客户
        function saveCustomerData(customers) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            initSampleData();
            loadCustomers();
        });
        
        // 加载客户列表
        function loadCustomers() {
            const customers = getAllCustomers();
            renderCustomers(customers);
            updateStats(customers);
        }
        
        // 渲染客户表格
        function renderCustomers(customers) {
            const container = document.getElementById('customerList');
            
            if (customers.length === 0) {
                container.innerHTML = '<p style="color: #95a5a6; text-align: center; padding: 40px;">暂无客户数据，点击"新增客户"开始添加</p>';
                return;
            }
            
            let html = '<table>';
            html += '<tr><th>客户编码</th><th>客户名称</th><th>联系人</th><th>联系电话</th><th>资质类型</th><th>到期日期</th><th>状态</th><th>操作</th></tr>';
            
            customers.forEach(customer => {
                const status = getQualificationStatus(customer.qualificationExpiryDate);
                const statusClass = 'status-' + status;
                const statusText = getStatusText(status);
                
                html += `<tr>
                    <td>${customer.customerCode || ''}</td>
                    <td>${customer.customerName || ''}</td>
                    <td>${customer.contactPerson || ''}</td>
                    <td>${customer.phone || ''}</td>
                    <td>${customer.qualificationType || ''}</td>
                    <td>${customer.qualificationExpiryDate || ''}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>
                        <button onclick="editCustomer(${customer.id})" style="padding: 5px 10px; margin-right: 5px; background: #3498db; color: white; border: none; border-radius: 3px; cursor: pointer;">编辑</button>
                        <button onclick="deleteCustomer(${customer.id})" style="padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">删除</button>
                    </td>
                </tr>`;
            });
            
            html += '</table>';
            container.innerHTML = html;
        }
        
        // 更新统计信息
        function updateStats(customers) {
            let valid = 0, expiring = 0, expired = 0;
            
            customers.forEach(customer => {
                const status = getQualificationStatus(customer.qualificationExpiryDate);
                if (status === 'valid') valid++;
                else if (status === 'expiring') expiring++;
                else if (status === 'expired') expired++;
            });
            
            document.getElementById('totalCount').textContent = customers.length;
            document.getElementById('validCount').textContent = valid;
            document.getElementById('expiringCount').textContent = expiring;
            document.getElementById('expiredCount').textContent = expired;
        }
        
        // 获取资质状态
        function getQualificationStatus(expiryDate) {
            if (!expiryDate) return 'unknown';
            const expiry = new Date(expiryDate);
            const today = new Date();
            const daysDiff = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
            
            if (daysDiff < 0) return 'expired';
            if (daysDiff <= 30) return 'expiring';
            return 'valid';
        }
        
        // 获取状态文本
        function getStatusText(status) {
            switch(status) {
                case 'valid': return '有效';
                case 'expiring': return '即将到期';
                case 'expired': return '已过期';
                default: return '未知';
            }
        }
        
        // 显示新增模态框
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增客户';
            document.getElementById('customerForm').reset();
            document.getElementById('customerId').value = '';
            document.getElementById('customerModal').classList.add('show');
        }
        
        // 编辑客户
        function editCustomer(id) {
            const customers = getAllCustomers();
            const customer = customers.find(c => c.id === id);
            
            if (customer) {
                document.getElementById('modalTitle').textContent = '编辑客户';
                document.getElementById('customerId').value = customer.id;
                document.getElementById('customerCode').value = customer.customerCode || '';
                document.getElementById('customerName').value = customer.customerName || '';
                document.getElementById('contactPerson').value = customer.contactPerson || '';
                document.getElementById('phone').value = customer.phone || '';
                document.getElementById('qualificationExpiryDate').value = customer.qualificationExpiryDate || '';
                document.getElementById('qualificationType').value = customer.qualificationType || '';
                
                document.getElementById('customerModal').classList.add('show');
            }
        }
        
        // 保存客户
        function saveCustomer(event) {
            event.preventDefault();
            
            const customer = {
                customerCode: document.getElementById('customerCode').value,
                customerName: document.getElementById('customerName').value,
                contactPerson: document.getElementById('contactPerson').value,
                phone: document.getElementById('phone').value,
                qualificationExpiryDate: document.getElementById('qualificationExpiryDate').value,
                qualificationType: document.getElementById('qualificationType').value
            };
            
            const id = document.getElementById('customerId').value;
            let customers = getAllCustomers();
            
            if (id) {
                // 更新
                const index = customers.findIndex(c => c.id === parseInt(id));
                if (index !== -1) {
                    customer.id = parseInt(id);
                    customers[index] = customer;
                }
            } else {
                // 新增
                customer.id = customers.length > 0 ? Math.max(...customers.map(c => c.id)) + 1 : 1;
                customers.push(customer);
            }
            
            saveCustomerData(customers);
            hideModal();
            loadCustomers();
            alert(id ? '客户更新成功' : '客户添加成功');
        }
        
        // 删除客户
        function deleteCustomer(id) {
            if (!confirm('确定要删除这个客户吗？')) return;
            
            let customers = getAllCustomers();
            customers = customers.filter(c => c.id !== id);
            saveCustomerData(customers);
            loadCustomers();
            alert('客户删除成功');
        }
        
        // 隐藏模态框
        function hideModal() {
            document.getElementById('customerModal').classList.remove('show');
        }
        
        // 导出数据
        function exportData() {
            const customers = getAllCustomers();
            const dataStr = JSON.stringify(customers, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = '客户数据_' + new Date().toISOString().split('T')[0] + '.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
    </script>
</body>
</html>
