<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗器械产品信息管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8fafc; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: #059669; color: white; padding: 25px; border-radius: 10px; margin-bottom: 30px; }
        .stats-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .stat-value { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .toolbar { background: white; padding: 20px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .search-box { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; font-weight: 600; }
        .status-instock { color: #10b981; font-weight: bold; }
        .status-lowstock { color: #f59e0b; font-weight: bold; }
        .status-outstock { color: #ef4444; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; }
        .form-hint { color: #64748b; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 医疗器械产品信息管理系统</h1>
            <p>管理医疗器械产品信息、库存、价格及资质证件</p>
        </header>
        
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-label">总产品数</div>
                <div class="stat-value" id="totalProducts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">库存充足</div>
                <div class="stat-value" id="instockProducts" style="color: #10b981;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">库存预警</div>
                <div class="stat-value" id="lowstockProducts" style="color: #f59e0b;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">缺货产品</div>
                <div class="stat-value" id="outstockProducts" style="color: #ef4444;">0</div>
            </div>
        </div>
        
        <div class="toolbar">
            <button class="btn btn-primary" onclick="showAddModal()">➕ 新增产品</button>
            <button class="btn btn-success" onclick="loadProducts()">🔄 刷新</button>
            <button class="btn" style="background: #8b5cf6; color: white;" onclick="exportData()">📥 导出数据</button>
            <input type="text" class="search-box" placeholder="搜索产品名称、型号、注册证号..." onkeyup="searchProducts(this.value)">
        </div>
        
        <div id="productList">
            <p>加载中...</p>
        </div>
    </div>
    
    <!-- 产品表单模态框 -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 25px; color: #059669;">新增产品</h2>
            
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                
                <!-- 产品基本信息 -->
                <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0;">
                    <h3 style="color: #059669; margin-bottom: 15px;">📋 产品基本信息</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">产品编码 <span style="color: red;">*</span></label>
                            <input type="text" class="form-control" id="productCode" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">产品名称 <span style="color: red;">*</span></label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">产品型号</label>
                            <input type="text" class="form-control" id="productModel">
                        </div>
                        <div class="form-group">
                            <label class="form-label">产品规格</label>
                            <input type="text" class="form-control" id="productSpec">
                        </div>
                    </div>
                </div>
                
                <!-- 医疗器械属性 -->
                <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0;">
                    <h3 style="color: #059669; margin-bottom: 15px;">🏥 医疗器械属性</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">医疗器械注册证号</label>
                            <input type="text" class="form-control" id="medicalLicense">
                            <div class="form-hint">如：国械注准2021XXXXXXX</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">生产许可证号</label>
                            <input type="text" class="form-control" id="productionLicense">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">医疗器械分类</label>
                            <select class="form-control" id="medicalCategory">
                                <option value="">请选择</option>
                                <option value="一类">一类医疗器械</option>
                                <option value="二类">二类医疗器械</option>
                                <option value="三类">三类医疗器械</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">注册证有效期</label>
                            <input type="date" class="form-control" id="licenseExpiry">
                        </div>
                    </div>
                </div>
                
                <!-- 库存管理 -->
                <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0;">
                    <h3 style="color: #059669; margin-bottom: 15px;">📦 库存管理</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">当前库存数量</label>
                            <input type="number" class="form-control" id="stockQuantity" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">计量单位</label>
                            <input type="text" class="form-control" id="unit" value="个">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">最低库存预警</label>
                            <input type="number" class="form-control" id="minStock" min="0" value="10">
                            <div class="form-hint">库存低于此数量时预警</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">存储条件</label>
                            <input type="text" class="form-control" id="storageCondition" value="常温">
                        </div>
                    </div>
                </div>
                
                <!-- 价格信息 -->
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #059669; margin-bottom: 15px;">💰 价格信息</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">采购单价（元）</label>
                            <input type="number" class="form-control" id="purchasePrice" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label class="form-label">销售单价（元）</label>
                            <input type="number" class="form-control" id="salePrice" min="0" step="0.01">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">供应商</label>
                            <input type="text" class="form-control" id="supplier">
                        </div>
                        <div class="form-group">
                            <label class="form-label">产品批号</label>
                            <input type="text" class="form-control" id="batchNumber">
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">保存产品</button>
                    <button type="button" class="btn" onclick="hideModal()" style="flex: 1; background: #64748b; color: white;">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 产品数据存储
        const STORAGE_KEY = 'medical_products_standalone';
        
        // 初始化示例数据
        function initSampleData() {
            const existingData = localStorage.getItem(STORAGE_KEY);
            if (!existingData) {
                const sampleData = [
                    {
                        id: 1,
                        productCode: 'PROD2026001',
                        productName: '一次性使用无菌注射器',
                        productModel: '5ml',
                        productSpec: '带针',
                        medicalLicense: '国械注准20213456789',
                        productionLicense: '苏食药监械生产许20210001',
                        medicalCategory: '三类',
                        licenseExpiry: '2026-12-31',
                        stockQuantity: 150,
                        unit: '支',
                        minStock: 50,
                        storageCondition: '常温干燥',
                        purchasePrice: 1.20,
                        salePrice: 2.50,
                        supplier: '江苏医疗器械有限公司',
                        batchNumber: '20260401'
                    },
                    {
                        id: 2,
                        productCode: 'PROD2026002',
                        productName: '医用外科口罩',
                        productModel: '三层',
                        productSpec: '耳挂式',
                        medicalLicense: '国械注准20212345678',
                        productionLicense: '沪食药监械生产许20210002',
                        medicalCategory: '二类',
                        licenseExpiry: '2026-06-30',
                        stockQuantity: 25,
                        unit: '盒',
                        minStock: 30,
                        storageCondition: '常温',
                        purchasePrice: 8.50,
                        salePrice: 15.00,
                        supplier: '上海医疗用品厂',
                        batchNumber: '20260315'
                    },
                    {
                        id: 3,
                        productCode: 'PROD2026003',
                        productName: '电子体温计',
                        productModel: 'DT-01',
                        productSpec: '额温枪',
                        medicalLicense: '国械注准20211234567',
                        productionLicense: '粤食药监械生产许20210003',
                        medicalCategory: '二类',
                        licenseExpiry: '2027-03-31',
                        stockQuantity: 0,
                        unit: '个',
                        minStock: 10,
                        storageCondition: '常温防潮',
                        purchasePrice: 45.00,
                        salePrice: 89.00,
                        supplier: '广东医疗设备公司',
                        batchNumber: '20260228'
                    }
                ];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleData));
                return sampleData;
            }
            return JSON.parse(existingData);
        }
        
        // 获取所有产品
        function getAllProducts() {
            return initSampleData();
        }
        
        // 保存产品数据
        function saveProductData(products) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('产品管理系统页面加载完成');
            loadProducts();
        });
        
        // 加载产品列表
        function loadProducts() {
            console.log('正在加载产品数据...');
            const products = getAllProducts();
            console.log('获取到产品数据:', products.length, '个产品');
            renderProducts(products);
            updateStats(products);
        }
        
        // 渲染产品表格
        function renderProducts(products) {
            const container = document.getElementById('productList');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<p style="color: #95a5a6; text-align: center; padding: 40px;">暂无产品数据，点击"新增产品"开始添加</p>';
                return;
            }
            
            let html = '<table>';
            html += '<tr><th>产品编码</th><th>产品名称</th><th>型号</th><th>注册证号</th><th>库存数量</th><th>库存状态</th><th>销售单价</th><th>操作</th></tr>';
            
            products.forEach(product => {
                const status = getStockStatus(product.stockQuantity, product.minStock);
                const statusClass = 'status-' + status;
                const statusText = getStockStatusText(status);
                
                html += `<tr>
                    <td>${product.productCode || ''}</td>
                    <td>${product.productName || ''}</td>
                    <td>${product.productModel || ''}</td>
                    <td>${product.medicalLicense || ''}</td>
                    <td>${product.stockQuantity || 0} ${product.unit || ''}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>¥${product.salePrice ? product.salePrice.toFixed(2) : '0.00'}</td>
                    <td>
                        <button onclick="editProduct(${product.id})" style="padding: 5px 10px; margin-right: 5px; background: #3498db; color: white; border: none; border-radius: 3px; cursor: pointer;">编辑</button>
                        <button onclick="deleteProduct(${product.id})" style="padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">删除</button>
                    </td>
                </tr>`;
            });
            
            html += '</table>';
            container.innerHTML = html;
            console.log('产品表格渲染完成');
        }
        
        // 更新统计信息
        function updateStats(products) {
            let instock = 0, lowstock = 0, outstock = 0;
            
            products.forEach(product => {
                const status = getStockStatus(product.stockQuantity, product.minStock);
                if (status === 'instock') instock++;
                else if (status === 'lowstock') lowstock++;
