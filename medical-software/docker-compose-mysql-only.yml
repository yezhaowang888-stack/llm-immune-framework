version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medgsp-mysql-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourPassword123!
      MYSQL_DATABASE: med_gsp
      MYSQL_USER: medgsp_user
      MYSQL_PASSWORD: MedGspUser123!
    ports:
      - "3307:3306"  # 使用3307端口，避免与可能存在的MySQL冲突
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYourPassword123!"]
      timeout: 20s
      retries: 10