<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品库存查询 - 出入库智能体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .search-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .search-section {
                grid-template-columns: 1fr;
            }
        }
        
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .search-box h3 {
            color: #333;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-box h3 i {
            color: #667eea;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .results-header h2 {
            color: #333;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status-disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s;
        }
        
        tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tbody tr:nth-child(even):hover {
            background-color: #e9ecef;
        }
        
        td {
            padding: 15px;
            color: #333;
        }
        
        .stock-cell {
            font-weight: 600;
        }
        
        .stock-low {
            color: #dc3545;
        }
        
        .stock-normal {
            color: #28a745;
        }
        
        .stock-high {
            color: #007bff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #dc3545;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #28a745;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        .connection-test {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-robot"></i> 出入库智能体</h1>
            <p>惠迈医疗器械管理系统 - 产品库存查询平台</p>
        </div>
        
        <div class="card">
            <div class="search-section">
                <div class="search-box">
                    <h3><i class="fas fa-search"></i> 按产品编号查询</h3>
                    <div class="input-group">
                        <input type="text" id="productCode" placeholder="输入产品编号，如：PM001" value="PM001">
                        <button onclick="searchByCode()">查询</button>
                    </div>
                    <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">示例: PM001, PM002, PM003</p>
                </div>
                
                <div class="search-box">
                    <h3><i class="fas fa-search"></i> 按产品名称搜索</h3>
                    <div class="input-group">
                        <input type="text" id="productName" placeholder="输入产品名称，如：口罩">
                        <button onclick="searchByName()">搜索</button>
                    </div>
                    <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">支持模糊搜索</p>
                </div>
            </div>
            
            <div style="text-align: center;">
                <button onclick="getAllProducts()" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                    <i class="fas fa-list"></i> 查看所有产品
                </button>
                <button onclick="getInventoryStats()" style="background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%); margin-left: 10px;">
                    <i class="fas fa-chart-bar"></i> 库存统计
                </button>
                <button onclick="testConnection()" style="background: linear-gradient(135deg, #6c757d 0%, #495057 100%); margin-left: 10px;">
                    <i class="fas fa-plug"></i> 测试连接
                </button>
            </div>
            
            <div class="connection-test">
                <div id="connectionStatus" class="status-disconnected status-badge">
                    <i class="fas fa-times-circle"></i> 未连接数据库
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="results-section">
                <div class="results-header">
                    <h2><i class="fas fa-table"></i> 查询结果</h2>
                    <div id="resultCount" class="status-badge" style="background: #e9ecef; color: #495057;">
                        0 条记录
                    </div>
                </div>
                
                <div id="messageArea"></div>
                
                <div id="loading" class="loading" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>正在查询数据...</p>
                </div>
                
                <div id="resultsTable" class="table-container">
                    <!-- 表格内容将通过JavaScript动态生成 -->
                </div>
                
                <div id="statsSection" class="stats-grid" style="display: none;">
                    <!-- 统计信息将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 惠迈生物科技有限公司 | 出入库智能体 v1.0 | 开发: 惠迈高级工程师</p>
            <p>最后更新: 2026-04-01 13:40 GMT+8</p>
        </div>
    </div>

    <script>
        const API_BASE = '/api/inventory';
        
        // 页面加载时测试连接
        document.addEventListener('DOMContentLoaded', function() {
            testConnection();
        });
        
        // 显示消息
        function showMessage(type, message) {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = `
                <div class="${type}">
                    <i class="fas fa-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i>
                    ${message}
                </div>
            `;
            messageArea.style.display = 'block';
            
            // 5秒后自动隐藏
            setTimeout(() => {
                messageArea.style.display = 'none';
            }, 5000);
        }
        
        // 显示加载状态
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsTable').innerHTML = '';
            document.getElementById('statsSection').style.display = 'none';
        }
        
        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        // 测试数据库连接
        async function testConnection() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/test-connection`);
                const data = await response.json();
                
                const statusElement = document.getElementById('connectionStatus');
                if (data.mode === 'real-database') {
                    statusElement.innerHTML = '<i class="fas fa-check-circle"></i> 数据库连接正常';
                    statusElement.className = 'status-connected status-badge';
                    showMessage('success', '✅ 数据库连接成功！正在使用真实数据。');
                } else {
                    statusElement.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 示例数据模式';
                    statusElement.className = 'status-disconnected status-badge';
                    
                    let troubleshooting = '';
                    if (data.troubleshooting) {
                        troubleshooting = '<br><br><strong>排查建议:</strong><br>' + 
                            data.troubleshooting.map(item => `• ${item}`).join('<br>');
                    }
                    
                    showMessage('warning', 
                        `⚠️ 数据库连接失败，使用示例数据模式。<br>` +
                        `<strong>错误:</strong> ${data.error || '未知错误'}${troubleshooting}`
                    );
                }
            } catch (error) {
                const statusElement = document.getElementById('connectionStatus');
                statusElement.innerHTML = '<i class="fas fa-times-circle"></i> 连接测试失败';
                statusElement.className = 'status-disconnected status-badge';
                showMessage('error', `网络错误: ${error.message}`);
            } finally {
                hideLoading();
            }
        }
        
        // 根据产品编号查询
        async function searchByCode() {
            const code = document.getElementById('productCode').value.trim();
            if (!code) {
                showMessage('error', '请输入产品编号');
                return;
            }
            
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/product/${encodeURIComponent(code)}`);
                const data = await response.json();
                
                if (data.success) {
                    displayProductResult(data.data);
                    showMessage('success', `找到产品: ${code}`);
                } else {
                    showMessage('error', data.message || '查询失败');
                    displayEmptyResult();
                }
            } catch (error) {
                showMessage('error', `查询失败: ${error.message}`);
                displayEmptyResult();
            } finally {
                hideLoading();
            }
        }
        
        // 根据产品名称搜索
        async function searchByName() {
            const name = document.getElementById('productName').value.trim();
            if (!name) {
                showMessage('error', '请输入产品名称');
                return;
            }
            
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/search?name=${encodeURIComponent(name)}`);
                const data = await response.json();
                
                if (data.success) {
                    displayProductsTable(data.data, `搜索"${name}"的结果`);
                    document.getElementById('resultCount').textContent = `${data.count || data.data.length} 条记录`;
                    showMessage('success', `找到 ${data.count || data.data.length} 个产品`);
                } else {
                    showMessage('error', data.message || '搜索失败');
                    displayEmptyResult();
                }
            } catch (error) {
                showMessage('error', `搜索失败: ${error.message}`);
                displayEmptyResult();
            } finally {
                hideLoading();
            }
        }
        
        // 获取所有产品
        async function getAllProducts() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/products`);
                const data = await response.json();
                
                if (data.success) {
                    displayProductsTable(data.data, '所有产品列表');
                    document.getElementById('resultCount').textContent = `${data.count || data.data.length} 条记录`;
                    showMessage('success', `获取到 ${data.count || data.data.length} 个产品`);
                } else {
                    showMessage('error', data.message || '获取产品列表失败');
                    displayEmptyResult();
                }
            } catch (error) {
                showMessage('error', `获取失败: ${error.message}`);
                displayEmptyResult();
            } finally {
                hideLoading();
            }
        }
        
        // 获取库存统计
        async function getInventoryStats() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                
                if (data.success) {
                    displayStats(data);
                    showMessage('success', '库存统计获取成功');
                } else {
                    showMessage('error', data.message || '获取统计失败');
                    displayEmptyResult();
                }
            } catch (error) {
                showMessage('error', `获取失败: ${error.message}`);
                displayEmptyResult();
            } finally {
                hideLoading();
            }
        }
        
        // 显示单个产品结果
        function displayProductResult(product) {
            const table = document.getElementById('resultsTable');
            document.getElementById('statsSection').style.display = 'none';
            
            // 获取所有字段
            const fields = Object.keys(product);
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>字段</th>
                            <th>值</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            fields.forEach(field => {
                const value = product[field];
                let displayValue = value;
                let cellClass = '';
                
                // 格式化显示
                if (value === null || value === undefined) {
                    displayValue = '<span style="color: #999; font-style: italic;">空</span>';
                } else if (typeof value === 'boolean') {
                    displayValue = value ? '是' : '否';
                } else if (typeof value === 'object') {
                    displayValue = JSON.stringify(value);
                }
                
                // 检查是否为库存字段
                if (field.toLowerCase().includes('stock') || field.toLowerCase().includes('quantity')) {
                    cellClass = 'stock-cell';
                    const stockValue = Number(value);
                    if (!isNaN(stockValue)) {
                        if (stockValue < 10) {
                            cellClass += ' stock-low';
                        } else if (stockValue < 50) {
                            cellClass += ' stock-normal';
                        } else {
                            cellClass += ' stock-high';
                        }
                    }
                }
                
                html += `
                    <tr>
                        <td><strong>${field}</strong></td>
                        <td class="${cellClass}">${displayValue}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            table.innerHTML = html;
            document.getElementById('resultCount').textContent = '1 条记录';
        }
        
        // 显示产品表格
        function displayProductsTable(products, title) {
            const table = document.getElementById('resultsTable');
            document.getElementById('statsSection').style.display = 'none';
            
            if (!products || products.length === 0) {
                table.innerHTML = '<div class="loading"><p>没有找到产品数据</p></div>';
                document.getElementById('resultCount').textContent = '0 条记录';
                return;
            }
            
            // 获取表头（使用第一个产品的字段）
            const firstProduct = products[0];
            const headers = Object.keys(firstProduct);
            
            let html = `
                <table>
                    <thead>
                        <tr>
            `;
            
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            
            html += `
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            products.forEach(product => {
                html += '<tr>';
                headers.forEach(header => {
                    const value = product[header];
                    let displayValue = value;
                    let cellClass = '';
                    
                    // 格式化显示
                    if (value === null || value === undefined) {
                        displayValue = '<span style="color: #999; font-style: italic;">空</span>';
                    } else if (typeof value === 'boolean') {
                        displayValue = value ? '是' : '否';
                    } else if (typeof value === 'object') {
                        displayValue = JSON.stringify(value);
                    }
                    
                    // 检查是否为库存字段
                    if (header.toLowerCase().includes('stock') || header.toLowerCase().includes('quantity')) {
                        cellClass = 'stock-cell';
                        const stockValue = Number(value);
                        if (!isNaN(stockValue)) {
                            if (stockValue < 10) {
                                cellClass += ' stock-low';
                            } else if (stockValue < 50) {
                                cellClass += ' stock-normal';
                            } else {
                                cellClass += ' stock-high';
                            }
                        }
                    }
                    
                    html += `<td class="${cellClass}">${displayValue}</td>`;
                });
                html += '</tr>';
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            table.innerHTML = html;
        }
        
        // 显示统计信息
        function displayStats(data) {
            const table = document.getElementById('resultsTable');
            const statsSection = document.getElementById('statsSection');
            
            // 显示统计卡片
            if (data.stats) {
                statsSection.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">总产品数</div>
                        <div class="stat-value">${data.stats.totalProducts}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">总库存量</div>
                        <div class="stat-value">${data.stats.totalStock}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">平均库存</div>
                        <div class="stat-value">${data.stats.averageStock}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">低库存产品</div>
                        <div class="stat-value" style="color: #dc3545;">${data.stats.lowStock}</div>
                    </div>
                `;
                statsSection.style.display = 'grid';
            }
            
            // 显示产品表格
            if (data.data && data.data.length > 0) {
                displayProductsTable(data.data, '库存统计详情');
                document.getElementById('resultCount').textContent = `${data.data.length} 条记录`;
            } else {
                table.innerHTML = '<div class="loading"><p>没有库存数据</p></div>';
                document.getElementById('resultCount').textContent = '0 条记录';
            }
        }
        
        // 显示空结果
        function displayEmptyResult() {
            const table = document.getElementById('resultsTable');
            table.innerHTML = '<div class="loading"><p>没有找到数据</p></div>';
            document.getElementById('resultCount').textContent = '0 条记录';
            document.getElementById('statsSection').style.display = 'none';
        }
        
        // 回车键搜索
        document.getElementById('productCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchByCode();
        });
        
        document.getElementById('productName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchByName();
        });
    </script>
</body>
</html>
